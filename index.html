<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPTIK Studio — Architecture & Design</title>
    <meta name="description" content="OPTIK is an architecture and design studio shaping spaces with intention — from intimate residences to landmark cultural buildings." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Premium Fonts:
         Bebas Neue     → Large display/hero headings (replaces Anton)
         Cormorant Garamond → Editorial quotes, elegant sub-headings
         Inter          → Body text, UI labels
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body { height: 100%; margin: 0; scroll-behavior: smooth; }
      #root { height: 100%; }

      /* Premium custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f7f7f7; }
      ::-webkit-scrollbar-thumb { background: #111; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #000; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
